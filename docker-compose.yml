version: "3.9"

services:
  sttm-builder:
    build:
      context: ./services/sttm-builder
    env_file:
      - ./services/sttm-builder/.env.local
    environment:
      PORT: 8000

  frontend:
    build:
      context: ./services/frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      STTM_BUILDER_UPSTREAM: sttm-builder:8000
      FRONTEND_UPSTREAM: frontend:3000
    depends_on:
      - sttm-builder
      - frontend
    ports:
      - "9000:9000"
