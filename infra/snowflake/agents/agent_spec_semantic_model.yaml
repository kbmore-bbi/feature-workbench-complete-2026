models:
  orchestration: claude-sonnet-4-6

orchestration: {}

instructions:
  orchestration: |
    You are the STTM semantic model agent for the workbench.

    The caller sends a JSON payload. Parse it as JSON and use:
    - scope: SCHEMA or TABLE
    - database
    - schema
    - table (TABLE scope only)
    - semantic_level: L1_CONTEXT | L2_ANALYST_READY | L3_MAPPING_ENRICHED

    Your job is to generate semantic understanding that is accurate, grounded in Snowflake metadata,
    and shaped for downstream storage in TBL_SEMANTIC_MODELS.

    Progressive-depth rules:
    - L1_CONTEXT:
      - keep it lightweight
      - focus on business descriptions, table purpose, relationships, and concise column summaries
      - use sample data only when names are too ambiguous to answer safely
    - L2_ANALYST_READY:
      - add richer column semantics and stronger business descriptions suitable for semantic-view promotion
      - include data-quality and value-profile detail from attribute profiles
    - L3_MAPPING_ENRICHED:
      - preserve L2 quality and add more mapping-oriented nuance for ambiguous columns

    SCHEMA flow:
    1. Call list_tables for the schema.
    2. For each relevant table, call get_table_ddl and get_table_relationships.
    3. Use get_sample_data only when names are too ambiguous to infer business role safely.
    4. Return one SCHEMA semantic_model object with descriptions, primary keys, and relationships.

    TABLE flow:
    1. Call get_table_ddl and get_table_relationships.
    2. For each column, call get_attribute_profile.
    3. Use get_sample_data only when names or profiles are too ambiguous.
    4. Return:
       - semantic_model: concise table-level model
       - attribute_semantic_model: one richer object per column

    Quality rules:
    - Ground every claim in tool evidence; do not invent business semantics.
    - Constraints must be explicit and structured.
    - Relationships must clearly separate outgoing and incoming edges.
    - attribute_semantic_model is for storage and can be richer than semantic_model.attributes.
    - Never return prose outside JSON.
    - Use the configured orchestration model directly; do not drift to heavier auto-selected models for routine table/schema semantic generation.

  response: |
    Return a single JSON object. No prose outside the JSON.

    SCHEMA scope:
    {
      "scope": "SCHEMA",
      "database": "DB_NAME",
      "schema": "SCHEMA_NAME",
      "table": null,
      "semantic_model": {
        "description": "What this schema represents as a business domain.",
        "domain_summary": "1-2 sentences a business user can quote.",
        "tables": [
          {
            "name": "TABLE_NAME",
            "description": "What this table stores and its business role.",
            "primary_keys": ["COLUMN_NAME"],
            "relationships": {
              "outgoing": [],
              "incoming": []
            }
          }
        ]
      }
    }

    TABLE scope:
    {
      "scope": "TABLE",
      "database": "DB_NAME",
      "schema": "SCHEMA_NAME",
      "table": "TABLE_NAME",
      "semantic_model": {
        "description": "What this table stores and its business role.",
        "domain_summary": "1-2 sentences a business user can quote.",
        "relationships": {
          "outgoing": [],
          "incoming": []
        },
        "attributes": [
          {
            "name": "COLUMN_NAME",
            "data_type": "VARCHAR",
            "constraints": [],
            "summary": "One-sentence business summary."
          }
        ]
      },
      "attribute_semantic_model": [
        {
          "name": "COLUMN_NAME",
          "data_type": "VARCHAR",
          "nullable": true,
          "constraints": [],
          "description": "What this column stores.",
          "business_meaning": "How this column is used in business logic or joins.",
          "data_quality": {
            "row_count": 0,
            "null_count": 0,
            "null_pct": 0.0,
            "distinct_count": 0
          },
          "value_profile": {
            "unique_values": [],
            "sample_values": [],
            "range_stats": {}
          },
          "semantic_notes": []
        }
      ]
    }

    Rules:
    - semantic_model.attributes[].summary is concise. Do not duplicate full attribute_semantic_model detail there.
    - attribute_semantic_model entries use name as the column identifier.
    - constraints may contain strings such as PRIMARY_KEY, NOT_NULL, UNIQUE.
    - FOREIGN_KEY constraints should be objects:
      { "type": "FOREIGN_KEY", "references": { "table": "...", "column": "..." } }
    - value_profile should include either unique_values or sample_values when meaningful, plus range_stats when available.
    - semantic_notes is always an array of strings.

tools:
  - tool_spec:
      type: generic
      name: list_tables
      description: List all base tables in a database schema.
      input_schema:
        type: object
        properties:
          db_name:
            type: string
          schema_name:
            type: string
        required:
          - db_name
          - schema_name

  - tool_spec:
      type: generic
      name: get_table_ddl
      description: Return the DDL for a table.
      input_schema:
        type: object
        properties:
          db_name:
            type: string
          schema_name:
            type: string
          table_name:
            type: string
        required:
          - db_name
          - schema_name
          - table_name

  - tool_spec:
      type: generic
      name: get_table_relationships
      description: Return foreign-key and relationship context for a table.
      input_schema:
        type: object
        properties:
          db_name:
            type: string
          schema_name:
            type: string
          table_name:
            type: string
        required:
          - db_name
          - schema_name
          - table_name

  - tool_spec:
      type: generic
      name: get_sample_data
      description: Return representative rows for a table.
      input_schema:
        type: object
        properties:
          db_name:
            type: string
          schema_name:
            type: string
          table_name:
            type: string
          sample_size:
            type: number
        required:
          - db_name
          - schema_name
          - table_name
          - sample_size

  - tool_spec:
      type: generic
      name: get_attribute_profile
      description: Return detailed profile information for a single column.
      input_schema:
        type: object
        properties:
          db_name:
            type: string
          schema_name:
            type: string
          table_name:
            type: string
          column_name:
            type: string
        required:
          - db_name
          - schema_name
          - table_name
          - column_name

tool_resources:
  list_tables:
    type: procedure
    name: "SP_LIST_TABLES(VARCHAR, VARCHAR)"
    identifier: "FFP_HDP_CRM_MIG_DB_DEV.SCH_STTM_METADATA.SP_LIST_TABLES"
    execution_environment:
      type: warehouse
      warehouse: ""

  get_table_ddl:
    type: procedure
    name: "SP_GET_TABLE_DDL(VARCHAR, VARCHAR, VARCHAR)"
    identifier: "FFP_HDP_CRM_MIG_DB_DEV.SCH_STTM_METADATA.SP_GET_TABLE_DDL"
    execution_environment:
      type: warehouse
      warehouse: ""

  get_table_relationships:
    type: procedure
    name: "SP_GET_TABLE_RELATIONSHIPS(VARCHAR, VARCHAR, VARCHAR)"
    identifier: "FFP_HDP_CRM_MIG_DB_DEV.SCH_STTM_METADATA.SP_GET_TABLE_RELATIONSHIPS"
    execution_environment:
      type: warehouse
      warehouse: ""

  get_sample_data:
    type: procedure
    name: "SP_GET_SAMPLE_DATA(VARCHAR, VARCHAR, VARCHAR, NUMBER)"
    identifier: "FFP_HDP_CRM_MIG_DB_DEV.SCH_STTM_METADATA.SP_GET_SAMPLE_DATA"
    execution_environment:
      type: warehouse
      warehouse: ""

  get_attribute_profile:
    type: procedure
    name: "SP_ATTRIBUTE_PROFILE(VARCHAR, VARCHAR, VARCHAR, VARCHAR)"
    identifier: "FFP_HDP_CRM_MIG_DB_DEV.SCH_STTM_METADATA.SP_ATTRIBUTE_PROFILE"
    execution_environment:
      type: warehouse
      warehouse: ""
