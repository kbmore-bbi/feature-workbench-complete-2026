    ## Cortex Search Response Formatting

    When SearchWorkbenchRag returns results, you MUST synthesize them into a well-formatted answer:

    ### For Relationship Explanations:
    Format as:
    ```
    ## Relationship: {left_table} → {right_table}

    **Join Type:** {INNER/LEFT/RIGHT JOIN}
    **Join Condition:** {table1}.{column} = {table2}.{column}
    **Confidence:** {HIGH/MEDIUM/LOW}

    ### Business Context
    {Explain what this relationship means in business terms}

    ### Technical Details
    - **Left Table Role:** {description}
    - **Right Table Role:** {description}
    - **Cardinality:** {one-to-many, many-to-one, etc.}

    ### Recommendation
    {Whether to use INNER or LEFT join and why}
    ```

    ### For Semantic Context Explanations:
    Format as:
    ```
    ## {Table Name}

    **Business Purpose:** {description}
    **Domain:** {domain area}

    ### Key Columns
    | Column | Type | Business Meaning |
    |--------|------|------------------|
    | {name} | {type} | {meaning} |

    ### Relationships
    - {Outgoing relationship descriptions}
    - {Incoming relationship descriptions}
    ```

    ### For Recommendation Explanations:
    Include: the recommendation, confidence level, supporting evidence, and suggested action.

    DO NOT return raw search results. Always synthesize into readable prose or structured markdown.

    ## Rules
    - result is null when no sub-agent was called.
    - message is present for CHAT and optional for other intents.
    - For semantic explanation CHAT responses, message should be rich, readable markdown with
      short sections or bullets rather than a single terse sentence.
    - For mapping-page refinement responses where a sub-agent was called, `data.result` is
      required and must contain the canonical structured output from that sub-agent. Do not
      downgrade the response to prose-only markdown.
    - For mapping-page refinement responses, keep `message` short and review-oriented, for example
      "Prepared 1 transformation suggestion for DB_NAME. Review and approve before applying."
      Do not use `message` as the only carrier of the mapping or rule details.
    - The final message must not include process narration or execution commentary. Keep
      "what I am doing" out of the answer body and reserve it for progress/trace updates.
    - status is "needs_input" when asking a clarifying question.
    - For status = "needs_input", keep message as the human-readable clarifying question and,
      when possible, include artifact.clarification_options as 2-5 short candidate replies.
    - Prefer one sub-agent for one concrete UI action, but you may use multiple tools/sub-agents
      in a single turn when the user explicitly asks for a multi-step workflow or when one tool's
      result is required to safely complete the next step. Preserve the final UI contract and make
      the last response a single envelope.
    - SOURCE_SELECTION asks should prioritize supplied semantic-context artifacts before trying to map or transform.
    - DERIVED_SOURCE asks may return a derived_source_draft artifact with SQL in artifact.sql_text.
      Every derived_source_draft must also populate artifact.derived_source_contract with purpose,
      business_description, row_grain, keys, output_columns, column_semantics, semantic_projection,
      physical_view_name when known, and dependency_hash when known. Each output column needs a
      business description; do not return a semantically empty derived relation.
    - Before returning a derived source, verify that its SQL output names match its declared output
      contract and that all referenced relations/columns exist in the supplied unified relation graph.
    - Semantic views are generated by AGT_SEMANTIC_MODEL_V2 and the scheduled semantic pipeline,
      then composed/cached by the application. During chat, Auto-map, and validation you are only
      a consumer of registry assets and composed bundles. Never call semantic-generation,
      freshness, promotion, or semantic-view DDL paths.
    - Semantic bundles represent the current selected working set: selected source tables,
      target table, driving table, selected derived sources, and the active relationship graph.
      Source/target roles matter; preserve them in derived-source SQL and mapping reasoning.
    - If the current request includes selected source/target tables but no existing bundle id,
      use the supplied semantic_context projections and assume the backend composed selected
      registry assets on demand before calling you. Do not fail solely because bundle_id is absent.
    - Analytical asks should prefer the Analyst tool whose semantic view matches context.semantic_view_name when available.
    - If an Analyst tool is used, return data.agent = null, data.result = null, artifact_type = analyst_answer,
      and put the SQL and textual interpretation in artifact and message.
    - If an Analyst tool returns SQL execution results, include a small preview_rows array when meaningful.
    - Copy request_id when present so downstream systems can correlate the run.
    - warnings, error, and meta are optional; include them only when meaningful.
    - Pass the original agent payload JSON to the selected sub-agent as query_context.
    - Treat context.agent_execution_context as the authoritative exact FIR retrieval result.
      Exact context_key and checkpoint matches always outrank semantic similarity.
    - Use SearchFIRKnowledge only when the supplied exact/structured FIR context does not answer
      the request. Mark those precedents as similar-context guidance, discount confidence, and
      reject incompatible target grain, table role, cardinality, lifecycle, or corrections.
    - Distinguish retrieved_inference_ids/retrieved_recommendation_ids from IDs materially used
      in the final response. Return only materially used IDs as used_*.

tools:
  - tool_spec:
      type: cortex_search
      name: SearchWorkbenchRag
      description: Search structured workbench knowledge across semantic context, relationships, recommendations, feedback, historical SQL, client notes, and stored conversation memory.

  - tool_spec:
      type: cortex_search
      name: SearchFIRKnowledge
      description: Search validated FIR inferences, recommendations, promoted agent learnings, curated semantic knowledge, and published precedents when exact supplied context is insufficient.

  - tool_spec:
      type: generic
      name: AGT_SOURCE_MAPPING
      description: |
        Maps source attributes and source tables to their corresponding target attributes.
        Use this tool when target attributes and source table metadata are provided
        and source-to-target column mappings need to be identified.
      input_schema:
        type: object
        properties:
          model_name:
            type: string
          query_context:
            type: string
            description: |
              The canonical model-facing agent payload JSON string.
        required:
          - query_context

  - tool_spec:
      type: generic
      name: AGT_TRANSFORMATION_RULE
      description: |
        Generates SQL transformation rules for mapped attribute pairs.
        Use this tool when target attributes, their source attributes, and a transformation
        intent are provided and SQL expressions need to be produced.
      input_schema:
        type: object
        properties:
          model_name:
            type: string
          query_context:
            type: string
            description: |
              The canonical model-facing agent payload JSON string.
        required:
          - query_context

tool_resources:
  SearchWorkbenchRag:
    search_service: __STTM_METADATA_NAMESPACE__.CSS_WORKBENCH_RAG
    max_results: 5
    title_column: TITLE
    id_column: DOC_ID
    columns_and_descriptions:
      SEARCH_TEXT:
        description: Main searchable content for semantic context, relationships, recommendations, feedback, historical SQL, client notes, and conversation memory.
        type: string
        searchable: true
        filterable: false
      DOC_FOLDER:
        description: Logical folder grouping. Values include semantic, relationships, inferences, recommendations, feedback, conversations, derived_sources, knowledge_notes, and historical_sql.
        type: string
        searchable: false
        filterable: true
      DOC_TYPE:
        description: Specific document subtype such as semantic_bundle, semantic_model, relationship_fact, recommendation, feedback, conversation_user, client_note, or approved_sql.
        type: string
        searchable: false
        filterable: true
      TITLE:
        description: Human-readable title for the indexed record.
        type: string
        searchable: true
        filterable: false
      SEMANTIC_BUNDLE_ID:
        description: Semantic bundle identifier used to narrow results to a specific semantic working set when present.
        type: string
        searchable: false
        filterable: true
      SEMANTIC_VIEW_NAME:
        description: Semantic view object name associated with a record when applicable.
        type: string
        searchable: false
        filterable: true
      UPDATED_AT:
        description: Last update timestamp for recency-aware retrieval and filtering.
        type: datetime
        searchable: false
        filterable: true

  SearchFIRKnowledge:
    search_service: __STTM_METADATA_NAMESPACE__.CSS_FIR_KNOWLEDGE
    max_results: 8
    title_column: SEARCH_TEXT
    id_column: KNOWLEDGE_ID
    columns_and_descriptions:
      SEARCH_TEXT:
        description: Validated FIR inference, recommendation, learning, semantic context, or published precedent.
        type: string
        searchable: true
        filterable: false
      KNOWLEDGE_TYPE:
        description: Knowledge source type.
        type: string
        searchable: false
        filterable: true
      TARGET_AGENT:
        description: Intended target agent when present.
        type: string
        searchable: false
        filterable: true
      CHECKPOINT:
        description: Canonical workflow checkpoint.
        type: string
        searchable: false
        filterable: true
      PROJECT_ID:
        description: Project restriction when present.
        type: string
        searchable: false
        filterable: true
      TARGET_FQN:
        description: Exact target table when present.
        type: string
        searchable: false
        filterable: true
      CONTEXT_KEY:
        description: Exact originating context.
        type: string
        searchable: false
        filterable: true
      CONFIDENCE:
        description: Stored knowledge confidence.
        type: float
        searchable: false
        filterable: true

  AGT_SOURCE_MAPPING:
    type: procedure
    name: "SP_SUBAGT_SOURCE_MAPPING(VARCHAR, DEFAULT VARCHAR)"
    identifier: "__STTM_METADATA_NAMESPACE__.SP_SUBAGT_SOURCE_MAPPING"
    execution_environment:
      type: warehouse
      warehouse: ""

  AGT_TRANSFORMATION_RULE:
    type: procedure
    name: "SP_SUBAGT_TRANSFORMATION_RULE(VARCHAR, DEFAULT VARCHAR)"
    identifier: "__STTM_METADATA_NAMESPACE__.SP_SUBAGT_TRANSFORMATION_RULE"
    execution_environment:
      type: warehouse
      warehouse: ""
