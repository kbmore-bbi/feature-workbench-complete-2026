[project]
name = "sstm-builder"
version = "0.1.0"
description = "STTM Builder service — metadata selection API backed by Snowflake stored procedures"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "snowflake-snowpark-python>=1.20.0",
    "snowflake-connector-python>=4.5.0,<5",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pillow>=11.0.0",
    "swagger-ui-bundle>=1.1.0",
    "cortex-code-agent-sdk>=1.0.2,<2",
    "sqlglot>=30.0.0,<31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
